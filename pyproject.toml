[project]
name = "mcp-database"
version = "0.1.0"
description = "MySQL MCP service with Streamable HTTP transport"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.9.0,<2.0.0",
    "mysql-connector-python>=9.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
mcp-mysql = "mcp_mysql.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/mcp_mysql",
]
