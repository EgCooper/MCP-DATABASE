[project]
name = "mcp-database"
version = "0.3.0"
description = "Read-only MCP service for osTicket on MySQL/MariaDB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # FastMCP internals (call_tool override, CallToolResult passthrough) are tested on 1.30.
    "mcp[cli]>=1.30.0,<2.0.0",
    "anyio>=4.0.0",
    "mysql-connector-python>=9.2.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
mcp-mysql = "mcp_mysql.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/mcp_mysql",
]
