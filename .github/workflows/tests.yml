name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q --ignore=tests/test_mysql_integration.py --junitxml=results/unit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-python-${{ matrix.python }}
          path: results/*.xml

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ['mysql:8.0', 'mariadb:10.3']
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_mysql_integration.py --junitxml=results/database.xml
        env:
          MCP_TEST_MYSQL_PORT: ${{ job.services.database.ports[3306] }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-${{ strategy.job-index }}
          path: results/*.xml
